[workspace]
resolver = "2"
members = [
    "crates/swiftload-core",
    "crates/swiftload-testserver",
    "crates/swiftload-cli",
    "crates/swiftload-bench",
]
# The desktop shell is its own workspace. Building it needs the WebView system libraries
# (webkit2gtk on Linux, WebView2 on Windows), which the engine, the CLI and the benchmark
# harness do not: keeping it out means `cargo test --workspace` stays runnable anywhere,
# and CI installs those libraries only for the job that actually needs them.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/priyanktomer/AiGen"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2", "charset"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2"
rand = "0.9"
sha2 = "0.10"
httpdate = "1"
percent-encoding = "2"
futures-util = "0.3"
tokio-util = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
